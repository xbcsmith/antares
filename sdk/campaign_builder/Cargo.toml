[package]
name = "campaign_builder"
version = "0.1.0"
edition = "2021"
authors = ["Antares Contributors"]
description = "Campaign Builder - Visual editor for creating Antares campaigns"
license = "MIT"

[dependencies]
antares = { path = "../.." }
eframe = { version = "0.35", default-features = false, features = [
    "glow",              # OpenGL backend (most compatible, works without GPU)
    "default_fonts",     # Built-in fonts
    "wayland",           # Wayland support for Linux
    "x11",               # X11 support as fallback
] }
egui = "0.35"
# Backs the vendored autocomplete widget in ui_helpers/autocomplete_widget.rs
# (egui_autocomplete has no release compatible with egui 0.35 as of this bump).
fuzzy-matcher = "0.3.7"
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"
thiserror = "2.0"
regex = "1.13"
clap = { version = "4.6", features = ["derive"] }

# For file dialogs
rfd = "0.17"
# For clipboard support (if needed explicitly, though usually handled by egui/eframe)
arboard = "3.6"
# For image loading (portrait thumbnails)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# For GLB (binary glTF) mesh import
gltf = { version = "1", features = ["import"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24", features = [] }

[dev-dependencies]
tempfile = "3.27"

[lib]
name = "campaign_builder"
path = "src/lib.rs"

[[bin]]
name = "campaign-builder"
path = "src/main.rs"

[[bin]]
name = "migrate_maps"
path = "src/bin/migrate_maps.rs"
