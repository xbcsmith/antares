[workspace]
members = [
    ".",
    "sdk/campaign_builder",
]

[package]
name = "antares"
version = "0.1.0"
edition = "2021"
autobins = false
authors = ["Brett Smith <xbcsmith@example.com>"]
description = "A classic data driven turn-based RPG"
license = "Apache-2.0"
repository = "https://github.com/xbcsmith/antares"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.12"
thiserror = "2.0"
rand = "0.10"
rustyline = "18.0.1"
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
tar = "0.4"
sha2 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
bevy = { version = "0.19", default-features = true }
bevy_egui = "0.41"
wayland-client = "0.31.15"
wayland-sys = "0.31.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ordered-float = "5.3"
image = { version = "0.25", features = ["png"] }
noise = "0.9"
bytemuck = { version = "1", features = ["derive"] }

[[bin]]
name = "antares"
path = "src/bin/antares.rs"

[[bin]]
name = "antares-sdk"
path = "src/bin/antares_sdk.rs"

[[bin]]
name = "generate-foliage-textures"
path = "src/bin/generate_foliage_textures.rs"

[[bin]]
name = "generate-normal-map"
path = "src/bin/generate_normal_map.rs"

[dev-dependencies]
tempfile = "3.27"

# ── Build profiles ────────────────────────────────────────────────────────────

[profile.dev]
# Move DWARF debug info to a .dSYM bundle instead of embedding it in the
# binary.  This is the standard macOS dev workflow and reduces the size of
# debug-info sections linked into the binary itself.
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
# Thin LTO: cross-crate dead-code elimination without full-program link cost.
lto = "thin"
# Single codegen unit maximises optimisation quality.
codegen-units = 1
# Strip DWARF from release builds; a .dSYM can be generated separately.
strip = "debuginfo"
